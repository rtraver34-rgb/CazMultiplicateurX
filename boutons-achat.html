<script>
  // Remplace par l'adresse de ton site Netlify
  const API_URL = "https://TON-SITE.netlify.app/api";

  async function buy(pack) {
    const tg = Telegram.WebApp;
    try {
      const res = await fetch(`${API_URL}?pack=${pack}`);
      const data = await res.json();
      if (!data.link) return tg.showAlert("Paiement indisponible");
      tg.openInvoice(data.link, (status) => {
        if (status === "paid") {
          addStars(data.stars); // <-- remplace par ta fonction qui ajoute des étoiles
          tg.HapticFeedback.notificationOccurred("success");
        }
      });
    } catch (e) {
      tg.showAlert("Erreur réseau");
    }
  }
</script>
